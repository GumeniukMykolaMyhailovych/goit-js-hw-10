<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8" />
    <title>Countdown Timer</title>
  <script type="module" crossorigin src="/goit-js-hw-09/1-timer.js"></script>
  <link rel="modulepreload" crossorigin href="/goit-js-hw-09/assets/common-Z_Nrdj-q.js">
  <link rel="modulepreload" crossorigin href="/goit-js-hw-09/assets/vendor-A92OCY9B.js">
  <link rel="stylesheet" crossorigin href="/goit-js-hw-09/assets/common-CmuzJRY8.css">
  <link rel="stylesheet" crossorigin href="/goit-js-hw-09/assets/vendor-CUZofXIC.css">
</head>

<body>
    <input type="text" id="datetime-picker" />
    <button type="button" data-start disabled>Start</button>

    <div class="timer">
        <div class="field">
            <span class="value" data-days>00</span>
            <span class="label">Days</span>
        </div>
        <div class="field">
            <span class="value" data-hours>00</span>
            <span class="label">Hours</span>
        </div>
        <div class="field">
            <span class="value" data-minutes>00</span>
            <span class="label">Minutes</span>
        </div>
        <div class="field">
            <span class="value" data-seconds>00</span>
            <span class="label">Seconds</span>
        </div>
    </div>

</body>

</html>
